name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-js:
    name: Test js packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: pnpm --filter "./packages/**" build

      - name: Run JS packages tests
        run: pnpm -r test

  test-api:
    name: Test java api
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5          # v4 is deprecated — bump while you're in there
        with:
          java-version: '25'
          distribution: temurin
          cache: maven                        # now finds api/pom.xml

      - name: Run api tests
        run: ./mvnw test
        working-directory: api
