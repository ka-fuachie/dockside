server {
  listen 80;
  client_max_body_size 50m;
  absolute_redirect off;

  location /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  location ~ ^/sites/(?<slug>[a-z0-9-]+)$ {
    return 301 /sites/$slug/;
  }
  location ~ ^/sites/(?<slug>[a-z0-9-]+)/(?<rest>.*)$ {
    alias /srv/sites/$slug/current/$rest;
    index index.html;
  }
}
