global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['localhost:${API_PORT}']

  - job_name: worker
    static_configs:
      - targets: ['localhost:${WORKER_PORT}']
